# Render blueprint for the AccessMap frontend (a Vite static site).
#
# The app uses BrowserRouter, so nested URLs like /search or /venue/:id are
# real paths the server is asked for on a hard refresh or when a link is
# opened directly. Without a catch-all rewrite the host returns its own 404
# ("Not Found") for anything but /, because only /index.html exists on disk.
#
# The public/_redirects file in this repo is the Netlify/Cloudflare convention
# and is IGNORED by Render. On Render the SPA fallback is a rewrite rule, below:
# every path that isn't a real static asset is served index.html (HTTP 200), so
# React Router boots and resolves the route on the client.
services:
  - type: web
    name: accessmap-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
